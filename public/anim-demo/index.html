<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AYNI · Prototipo animación producto</title>
<style>
  :root {
    --gold: #f3c864;
    --gold-soft: rgba(243, 200, 100, 0.55);
    --gold-faint: rgba(243, 200, 100, 0.18);
    --ink: #050505;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background:
      radial-gradient(120% 90% at 50% 30%, #16130c 0%, #0a0805 45%, #030302 100%);
    color: #fff;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100%;
  }

  .hint {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold-soft);
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--gold-faint);
    padding: 8px 16px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
  }

  .replay {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 20;
    appearance: none;
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold);
    background: transparent;
    border: 1px solid var(--gold-soft);
    padding: 8px 16px;
    border-radius: 999px;
  }
  .replay:hover { background: rgba(243,200,100,0.1); }

  /* Vertical spacer so we can scroll the stage into view and trigger it */
  .spacer {
    height: 88vh;
    display: grid;
    place-items: center;
    color: var(--gold-soft);
    font-size: 14px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    opacity: 0.5;
  }
  .spacer span { animation: bob 1.8s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(8px); } }

  .stage-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 16px 120px;
  }

  /* The animation stage: fixed design coordinate space, scaled to fit */
  .stage {
    position: relative;
    width: 900px;
    height: 760px;
    max-width: 96vw;
    aspect-ratio: 900 / 760;
  }

  /* ---- Product ---- */
  .product {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 300px;
    height: auto;
    transform: translate(-50%, -50%) rotate(0deg) scale(0.96);
    transform-origin: 50% 55%;
    filter: drop-shadow(0 30px 45px rgba(0,0,0,0.6));
    transition: transform 1s cubic-bezier(0.22, 0.8, 0.24, 1);
    z-index: 3;
    opacity: 0;
    animation: fadeIn 0.6s ease forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }

  .play .product {
    transform: translate(-50%, -50%) rotate(6deg) scale(1);
  }

  /* soft glow behind product that blooms with the ring */
  .halo {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 380px;
    height: 380px;
    transform: translate(-50%, -50%) scale(0.6);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(243,200,100,0.22) 0%, rgba(243,200,100,0) 68%);
    opacity: 0;
    transition: opacity 1.1s ease, transform 1.2s ease;
    z-index: 1;
  }
  .play .halo { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  /* ---- SVG overlay (ring + branch stems) ---- */
  .lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 2;
    overflow: visible;
  }

  .ring {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.6;
    filter: drop-shadow(0 0 6px rgba(243,200,100,0.5));
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    transition: stroke-dashoffset 1.15s cubic-bezier(0.65, 0, 0.35, 1);
    transition-delay: 0.35s;
  }
  .play .ring { stroke-dashoffset: 0; }

  .stem {
    fill: none;
    stroke: var(--gold);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    transition: stroke-dashoffset 0.5s ease-out;
    transition-delay: var(--stem-delay);
  }
  .play .stem { stroke-dashoffset: 0; }

  .node {
    fill: var(--gold);
    transform: scale(0);
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    transition-delay: var(--node-delay);
    filter: drop-shadow(0 0 4px rgba(243,200,100,0.7));
  }
  .play .node { transform: scale(1); }

  /* ---- Labels ---- */
  .label {
    position: absolute;
    z-index: 4;
    white-space: nowrap;
    color: var(--gold);
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    /* reveal wipes outward from the branch origin */
    clip-path: inset(0 100% 0 0);
    opacity: 0;
    transition: clip-path 0.5s cubic-bezier(0.22, 0.8, 0.24, 1), opacity 0.05s linear;
    transition-delay: var(--label-delay);
  }
  .label.to-left {
    text-align: right;
    transform: translate(-100%, -50%);
    clip-path: inset(0 0 0 100%); /* wipe from right (branch) toward left */
  }
  .label.to-right {
    transform: translate(0, -50%);
  }
  .play .label { clip-path: inset(0 0 0 0); opacity: 1; }

  .label small {
    display: block;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--gold-soft);
    font-weight: 400;
    margin-top: 3px;
  }
</style>
</head>
<body>
  <div class="hint">Haz scroll ↓ o pasa el cursor sobre el producto</div>
  <button class="replay" type="button" id="replay">Repetir ▸</button>

  <div class="spacer"><span>Scroll</span></div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div class="halo"></div>
      <img class="product" id="product" src="/anim-demo/capucci.webp" alt="Capucci 360" />
      <svg class="lines" id="lines" viewBox="0 0 900 760" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </div>

<script>
  const CENTER = { x: 450, y: 380 };
  const RING_R = 180;

  // Each ingredient radiates from the ring at a given angle (degrees, 0 = right,
  // negative = up). Left-side items get their label anchored to the right edge.
  const INGREDIENTS = [
    { name: 'MACA',       note: 'Energía',       angle: 150, stem: 155, side: 'left'  },
    { name: 'COLÁGENO',   note: 'Piel & huesos', angle: 180, stem: 170, side: 'left'  },
    { name: 'AMALAKI',    note: 'Vitamina C',    angle: 210, stem: 155, side: 'left'  },
    { name: 'CAFÉ',       note: 'Antioxidante',  angle: 40,  stem: 150, side: 'right' },
    { name: 'MORINGA',    note: 'Vitaminas',     angle: 13,  stem: 168, side: 'right' },
    { name: 'GANODERMA',  note: 'Inmunidad',     angle: -14, stem: 172, side: 'right' },
    { name: 'ESPIRULINA', note: 'Proteína',      angle: -42, stem: 152, side: 'right' },
  ];

  const RING_START_DELAY = 0.35;
  const RING_DUR = 1.15;
  const STEM_STAGGER = 0.13;
  const STEM_DUR = 0.5;

  const svgNS = 'http://www.w3.org/2000/svg';
  const lines = document.getElementById('lines');
  const stage = document.getElementById('stage');

  // Ring
  const ring = document.createElementNS(svgNS, 'circle');
  ring.setAttribute('class', 'ring');
  ring.setAttribute('cx', CENTER.x);
  ring.setAttribute('cy', CENTER.y);
  ring.setAttribute('r', RING_R);
  const ringLen = 2 * Math.PI * RING_R;
  ring.style.setProperty('--len', ringLen.toFixed(1));
  lines.appendChild(ring);

  const rad = (d) => (d * Math.PI) / 180;

  INGREDIENTS.forEach((ing, i) => {
    const a = rad(ing.angle);
    const p1 = { x: CENTER.x + Math.cos(a) * RING_R, y: CENTER.y - Math.sin(a) * RING_R };
    const p2 = { x: CENTER.x + Math.cos(a) * (RING_R + ing.stem), y: CENTER.y - Math.sin(a) * (RING_R + ing.stem) };

    const stemStart = RING_START_DELAY + RING_DUR * 0.62 + i * STEM_STAGGER;
    const nodeDelay = stemStart + STEM_DUR * 0.85;
    const labelDelay = nodeDelay + 0.05;

    // stem line
    const stem = document.createElementNS(svgNS, 'line');
    stem.setAttribute('class', 'stem');
    stem.setAttribute('x1', p1.x.toFixed(1));
    stem.setAttribute('y1', p1.y.toFixed(1));
    stem.setAttribute('x2', p2.x.toFixed(1));
    stem.setAttribute('y2', p2.y.toFixed(1));
    const stemLen = Math.hypot(p2.x - p1.x, p2.y - p1.y);
    stem.style.setProperty('--len', stemLen.toFixed(1));
    stem.style.setProperty('--stem-delay', stemStart.toFixed(2) + 's');
    lines.appendChild(stem);

    // node dot
    const node = document.createElementNS(svgNS, 'circle');
    node.setAttribute('class', 'node');
    node.setAttribute('cx', p2.x.toFixed(1));
    node.setAttribute('cy', p2.y.toFixed(1));
    node.setAttribute('r', 4.2);
    node.style.setProperty('--node-delay', nodeDelay.toFixed(2) + 's');
    lines.appendChild(node);

    // label (HTML, positioned in stage % coords)
    const label = document.createElement('div');
    label.className = 'label ' + (ing.side === 'left' ? 'to-left' : 'to-right');
    const gap = ing.side === 'left' ? -12 : 12;
    label.style.left = ((p2.x + gap) / 900 * 100).toFixed(3) + '%';
    label.style.top = (p2.y / 760 * 100).toFixed(3) + '%';
    label.style.setProperty('--label-delay', labelDelay.toFixed(2) + 's');
    label.innerHTML = ing.name + '<small>' + ing.note + '</small>';
    stage.appendChild(label);
  });

  // ---- Trigger control ----
  function play() {
    stage.classList.remove('play');
    // force reflow so re-adding restarts transitions
    void stage.offsetWidth;
    stage.classList.add('play');
  }
  function reset() { stage.classList.remove('play'); }

  // Scroll into view
  const io = new IntersectionObserver((entries) => {
    entries.forEach((e) => {
      if (e.isIntersecting) play();
      else reset();
    });
  }, { threshold: 0.55 });
  io.observe(stage);

  // Hover replay
  document.getElementById('product').addEventListener('mouseenter', play);
  document.getElementById('replay').addEventListener('click', play);
</script>
</body>
</html>
