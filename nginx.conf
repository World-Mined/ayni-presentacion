# Configuración del contenedor que sirve `dist/`. Existe por las cabeceras: el
# sitio es estático pero el libro de reclamaciones recoge documento de
# identidad y domicilio, y sin esto se servía sin una sola cabecera de
# seguridad.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    # Redirecciones relativas: el contenedor escucha en :80 detrás de un proxy,
    # así que un `Location` absoluto perdería el puerto y el esquema públicos.
    absolute_redirect off;

    # Ver `nginx-security-headers.conf`: cualquier `location` que añada sus
    # propias cabeceras tiene que volver a incluirlo.
    include /etc/nginx/snippets/security-headers.conf;

    # El service worker debe poder anunciar una build nueva: si el navegador lo
    # sirve de su propia caché, `skipWaiting` nunca llega a ejecutarse.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Los assets de `/_astro/` llevan hash de contenido: son inmutables.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # `/productos` también tiene un directorio físico para sus rutas hijas.
    # Conserva una única URL canónica y evita que Nginx intente listar ese
    # directorio, que no contiene `index.html`.
    location = /productos/ {
        return 308 /productos$is_args$args;
    }

    location / {
        # El build emite `pagina.html`, no `pagina/index.html`. Se prueba antes
        # que `$uri` porque una página puede compartir nombre con un directorio.
        try_files $uri.html $uri $uri/ =404;
    }
}
