# Configuración del contenedor que sirve `dist/`. Existe por las cabeceras: el
# sitio es estático pero el libro de reclamaciones recoge documento de
# identidad y domicilio, y sin esto se servía sin una sola cabecera de
# seguridad.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # `script-src` va por hashes, no por 'unsafe-inline': el sitio es estático y
    # no puede emitir nonces, así que es la única forma de que la política valga
    # algo. Los genera `npm run csp:write` leyendo `dist/`, y `npm run csp:check`
    # —parte de `npm test`— falla si se desfasan. No editar la lista a mano.
    #
    # `style-src` sí conserva 'unsafe-inline': Astro calcula atributos `style=`
    # en línea, por ejemplo los hotspots del mapa de puntos de recojo.
    #
    #   media-src  : los MP4 viven en S3 (`PUBLIC_MEDIA_BASE_URL`).
    #   font-src   : Google Fonts, declarado en `Layout.astro`.
    #   frame-src  : los embeds de Google Maps de los puntos de recojo.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-8N6J7cjjm4ZDd9v8UFA+vTA1DSWIlHH/05pEWCFQcsA=' 'sha256-LuF09/CHzmrpmMI11BJojlH/LwhTNEAhjvxQfJxhi3Q=' 'sha256-LvX6Bf5vGwcg+LM690ffKLUSY+PryHm9s09j2pAN7+M=' 'sha256-NNhkWwPWbM2N4c1+LZGbSvO65kgPWm62f3RaMJTRAzU=' 'sha256-WnAaUvaqgR/5PDWTwe8eL11CVeAZxtp96LP1cNrG7wg=' 'sha256-aQk5MMklUrTz807oR+k/Rnh86+16gkV5MXGkJYARfag=' 'sha256-bK1G+ga9o8MU7ERWAdNQM9xpcw1zk36d+YIt9TT9N9E='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' https://ayni.s3.us-east-1.amazonaws.com; connect-src 'self'; frame-src https://www.google.com; manifest-src 'self'; worker-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # El service worker debe poder anunciar una build nueva: si el navegador lo
    # sirve de su propia caché, `skipWaiting` nunca llega a ejecutarse.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # Los assets de `/_astro/` llevan hash de contenido: son inmutables.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        # El build emite `pagina.html`, no `pagina/index.html`.
        try_files $uri $uri/ $uri.html =404;
    }
}
