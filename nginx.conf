# Configuración del contenedor que sirve `dist/`. Existe por las cabeceras: el
# sitio es estático pero el libro de reclamaciones recoge documento de
# identidad y domicilio, y sin esto se servía sin una sola cabecera de
# seguridad.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Astro emite un `<script is:inline>` en el layout y atributos `style=`
    # calculados (por ejemplo los hotspots del mapa), así que 'unsafe-inline'
    # sigue siendo necesario en script-src y style-src. El resto de la política
    # sí cierra: nada de plugins, nada de <base> ajeno, y los envíos de
    # formulario no pueden salir del propio origen.
    #
    #   media-src  : los MP4 viven en S3 (`PUBLIC_MEDIA_BASE_URL`).
    #   font-src   : Google Fonts, declarado en `Layout.astro`.
    #   frame-src  : ningún punto de recojo usa hoy `preview.type: 'embed'`.
    #                Si se añade uno, hay que abrir aquí su origen.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' https://ayni.s3.us-east-1.amazonaws.com; connect-src 'self'; frame-src 'none'; manifest-src 'self'; worker-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # El service worker debe poder anunciar una build nueva: si el navegador lo
    # sirve de su propia caché, `skipWaiting` nunca llega a ejecutarse.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # Los assets de `/_astro/` llevan hash de contenido: son inmutables.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        # El build emite `pagina.html`, no `pagina/index.html`.
        try_files $uri $uri/ $uri.html =404;
    }
}
