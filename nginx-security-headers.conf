# Cabeceras de seguridad comunes a todas las respuestas.
#
# Viven en su propio archivo porque `add_header` no se hereda: un `location`
# que declara cualquier `add_header` (por ejemplo `Cache-Control`) descarta
# todos los del `server`. Cada bloque con cabeceras propias debe incluir este
# archivo; si no, `/_astro/*.js` o `/sw.js` salen sin CSP ni `nosniff`.
#
# `script-src` va por hashes, no por 'unsafe-inline': el sitio es estático y
# no puede emitir nonces, así que es la única forma de que la política valga
# algo. `script-src` y `media-src` los genera `npm run csp:write` leyendo
# `dist/`, y `npm run csp:check` —parte de `npm test`— falla si se desfasan.
# El Dockerfile los regenera sobre su propia build. No editarlos a mano.
#
# `style-src` sí conserva 'unsafe-inline': Astro calcula atributos `style=`
# en línea, por ejemplo los hotspots del mapa de puntos de recojo.
#
#   media-src  : los orígenes de los <video> del build (`PUBLIC_MEDIA_BASE_URL`).
#   font-src   : Google Fonts, declarado en `Layout.astro`.
#   frame-src  : los embeds de Google Maps de los puntos de recojo.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'sha256-LuF09/CHzmrpmMI11BJojlH/LwhTNEAhjvxQfJxhi3Q=' 'sha256-LvX6Bf5vGwcg+LM690ffKLUSY+PryHm9s09j2pAN7+M=' 'sha256-NNhkWwPWbM2N4c1+LZGbSvO65kgPWm62f3RaMJTRAzU=' 'sha256-WnAaUvaqgR/5PDWTwe8eL11CVeAZxtp96LP1cNrG7wg=' 'sha256-wuyyhU9Su/1XFCF4Qp63F+K1+lyPjhYpwCxI9SwpZjI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' https://ayni.s3.us-east-1.amazonaws.com; connect-src 'self'; frame-src https://www.google.com; manifest-src 'self'; worker-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
